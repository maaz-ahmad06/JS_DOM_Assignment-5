<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Events</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Task 1 -->
    <section>
        <h2>Task 1: Button Click</h2>
        <button id="clickBtn">Click Me</button>
    </section>

    <!-- Task 2 -->
        <h2>Task 2: Change Text</h2>
        <p id="text">Original Text</p>
        <button id="changeTextBtn">Change Text</button>
    

    <!-- Task 3 -->
        <h2>Task 3: Background Color</h2>
        <button id="bgBtn">Change Background</button>
    

    <!-- Task 4 -->
        <h2>Task 4: Live Typing</h2>
        <input type="text" id="liveInput" placeholder="Type something...">
        <p id="liveText"></p>
    

    <!-- Task 5 -->
        <h2>Task 5: Mouse Events</h2>
        <div id="box"></div>
    

    <!-- Task 6 -->
        <h2>Task 6: Double Click</h2>
        <button id="dblBtn">Double Click Me</button>
    

    <script src="script.js"></script>
</body>

</html>
